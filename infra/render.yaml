# Render Blueprint. In Render: New > Blueprint, pick this repo, set "Blueprint Path" to infra/render.yaml.
# After the first deploy, fill the two `sync: false` variables (see README, "Deploy").
databases:
  - name: zbirka-db
    plan: free
    databaseName: zbirka
    user: zbirka

services:
  - type: web
    name: zbirka-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase: { name: zbirka-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false   # e.g. https://zbirka-web.onrender.com

  - type: web
    name: zbirka-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false   # e.g. https://zbirka-api.onrender.com
