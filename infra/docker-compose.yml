# Local full stack: docker compose -f infra/docker-compose.yml up --build
# Frontend: http://localhost:5173  API: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zbirka
      POSTGRES_PASSWORD: zbirka
      POSTGRES_DB: zbirka
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zbirka"]
      interval: 3s
      retries: 10

  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql://zbirka:zbirka@db:5432/zbirka
      JWT_SECRET: local-dev-secret
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build:
      context: ../frontend
      args: { VITE_API_URL: "http://localhost:8000" }
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  dbdata:
